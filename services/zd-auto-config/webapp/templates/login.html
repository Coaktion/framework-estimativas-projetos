<!doctype html><html lang=pt-br><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1"><title>ZD Auto Config — Aktie Now</title>
<link rel=preconnect href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;500;700&display=swap" rel=stylesheet>
<style>
:root{--bg:#09100D;--surface:#0f1712;--line:#20302a;--green:#7ED170;--green2:#CDFFB5;
--txt:#FFFFFF;--muted:#B8C9BE}
*{box-sizing:border-box}
body{font-family:Roboto,Arial,sans-serif;background:radial-gradient(1200px 600px at 70% -10%,#12241b 0,var(--bg) 55%);
color:var(--txt);display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
.card{background:var(--surface);border:1px solid var(--line);padding:36px;border-radius:16px;width:340px;
box-shadow:0 20px 60px rgba(0,0,0,.45)}
.logo{height:34px;margin-bottom:18px}
h1{font-family:"Bebas Neue",Arial;letter-spacing:1px;font-size:30px;margin:0 0 4px;color:var(--txt)}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);margin:7px 0;
background:#0b120f;color:var(--txt);font-size:14px}
input:focus{outline:none;border-color:var(--green)}
button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--green);color:#09100D;
font-weight:700;cursor:pointer;margin-top:12px;font-size:15px}
button:hover{background:var(--green2)}
.err{color:#ff9a9a;font-size:13px;margin:6px 0 0}
</style></head><body>
<div class=card>
<img class=logo src="https://aktienow.com/wp-content/uploads/2026/04/Logo_Aktie-Now_Cor_Branco-2.png" alt="Aktie Now"
 onerror="this.style.display='none'">
<h1>ZD AUTO CONFIG</h1>
<p class=sub>Provisionador de demos Zendesk</p>
<!--ERR-->
<form method=post action=/login>
<input name=username placeholder="Usuário" autofocus>
<input type=password name=password placeholder="Senha">
<button>Entrar</button></form></div></body></html>
